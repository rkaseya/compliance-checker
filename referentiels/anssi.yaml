referentiel: Guide d'hygiène informatique ANSSI
version: "2.0"
mesures:
  - id: "5"
    titre: Disposer d'un inventaire exhaustif des comptes privilégiés et le maintenir à jour
    checks: [uid0_unique]
  - id: "8"
    titre: Identifier nommément chaque personne accédant au système et distinguer les rôles utilisateur/administrateur
    checks: [ssh_root_login, root_verrouille]
  - id: "10"
    titre: Définir et vérifier des règles de choix et de dimensionnement des mots de passe
    checks: [politique_mdp, comptes_sans_mdp]
  - id: "11"
    titre: Protéger les mots de passe stockés sur les systèmes
    checks: [permissions_shadow]
  - id: "13"
    titre: Privilégier lorsque c'est possible une authentification forte
    checks: [ssh_password_auth]
  - id: "17"
    titre: Activer et configurer le pare-feu local
    checks: [pare_feu]
  - id: "21"
    titre: Utiliser des protocoles réseaux sécurisés dès qu'ils existent
    checks: [services_exposes]
  - id: "34"
    titre: Définir une politique de mise à jour des composants du système d'information
    checks: [mises_a_jour]
  - id: "36"
    titre: Activer et configurer les journaux des composants les plus importants
    checks: [journalisation]
