{% extends "audits/base.html" %}
{% block titre %}Connexion · Compliance Checker{% endblock %}
{% block contenu %}
<div class="carte connexion">
  <h1>Connexion</h1>
  <p class="meta">Accès réservé aux auditeurs.</p>
  {% if form.errors %}<p class="erreur-form">Identifiant ou mot de passe incorrect.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Nom d'utilisateur</label>
    <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>
    <label for="id_password">Mot de passe</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="bouton" type="submit">Se connecter</button>
  </form>
</div>
{% endblock %}
